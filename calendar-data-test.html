<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar Data Test</title>
</head>
<body>
<pre id="out">Loading...</pre>

<script src="./public/firebase-config.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  limit
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const out = document.getElementById("out");

try {
  const app = initializeApp(window.FIREBASE_CONFIG, "calendarTest");
  const db = getFirestore(app);

  const snap = await getDocs(
    query(
      collection(db, "posts"),
      where("status", "==", "published"),
      limit(500)
    )
  );

  let result = "TOTAL = " + snap.size + "\\n\\n";

  for (const d of snap.docs) {
    const p = d.data();

    result +=
      "========================================\\n" +
      "TITLE: " + (p.title || "") + "\\n" +
      "CATEGORY: " + (p.category || "") + "\\n" +
      "START: " + (p.applicationStartDate || p.startDate || p.applyStartDate || "") + "\\n" +
      "LAST: " + (p.applicationLastDate || p.lastDate || p.applyLastDate || "") + "\\n" +
      "EXAM: " + (p.examDate || p.examDateTime || "") + "\\n" +
      "CONTENT FIELDS:\\n" +
      "content = " + String(p.content || "").length + " chars\\n" +
      "articleContent = " + String(p.articleContent || "").length + " chars\\n" +
      "body = " + String(p.body || "").length + " chars\\n" +
      "description = " + String(p.description || "").length + " chars\\n" +
      "excerpt = " + String(p.excerpt || "").length + " chars\\n\\n";
  }

  out.textContent = result;

} catch (e) {
  out.textContent = "ERROR\\n\\n" + (e.stack || e);
}
</script>
