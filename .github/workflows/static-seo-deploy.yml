name: Exam Darpan Automatic SEO Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Static article views do not read Firestore. Rebuild hourly to reduce
    # background full-collection Firestore reads; GitHub may delay scheduled runs.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: examdarpan-static-seo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r monitor_requirements.txt

      - name: Build static SEO pages
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/generate_static.py

      - name: Verify generated homepage
        run: |
          set -euo pipefail

          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/categories.html
          grep -q '<title>Exam Darpan – Govt Jobs, Results & Exam Updates in India</title>' public/index.html
          grep -q 'id="exam-darpan-student-first-home-v3"' public/index.html
          grep -q 'class="ed-v3-hero"' public/index.html
          grep -q 'सरकारी नौकरी की तैयारी में' public/index.html
          grep -q 'ed-v3-promise' public/index.html
          grep -Fq '"alternateName":["Exam Darpan Official","examdarpan.in"]' public/index.html

          CATEGORY_PAGE_COUNT="$(find public -maxdepth 1 -type f -name 'category-*.html' | wc -l | tr -d ' ')"
          echo "Generated category landing pages: ${CATEGORY_PAGE_COUNT}"
          test "${CATEGORY_PAGE_COUNT}" -ge 10
          grep -q 'href="/categories"' public/index.html

          grep -q "LIVE UPDATES" public/index.html
          grep -q "Rajasthan Government Jobs" public/index.html
          grep -q "All India Government Jobs" public/index.html
          grep -q 'id="daily-test"' public/index.html
          grep -q "Latest Articles" public/index.html
          grep -q 'class="ed-home-social"' public/index.html
          grep -q 'Exam Darpan से जुड़े रहें' public/index.html
          grep -q 'All Rights Reserved.' public/index.html
          grep -q 'https://chat.whatsapp.com/CoYGyHfbN1A61H66yUV4aK' public/index.html

          ARTICLE_COUNT="$(grep -rl "EXAM-DARPAN-GENERATED-ARTICLE" public/ 2>/dev/null | wc -l | tr -d ' ')"
          SITEMAP_COUNT="$(grep -c "<loc>" public/sitemap.xml || true)"

          echo "Generated article pages: ${ARTICLE_COUNT}"
          echo "Sitemap URLs: ${SITEMAP_COUNT}"


      - name: Report SEO sanity checks
        run: |
          python scripts/seo_sanity_audit.py

      - name: Install Firebase CLI
        if: github.event_name != 'pull_request'
        run: |
          npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          firebase use examdarpan-dd963
          firebase deploy --only hosting --non-interactive

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f /tmp/firebase-service-account.json
