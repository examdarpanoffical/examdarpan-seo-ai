name: Exam Darpan Automatic SEO Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examdarpan-static-seo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r monitor_requirements.txt

      - name: Build static SEO pages
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/generate_static.py

      - name: Verify generated homepage
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/categories.html
          grep -Fq 'id="exam-darpan-home-final-order"' public/index.html
          grep -Fq 'class="ed-home-live"' public/index.html
          grep -Fq 'class="ed-home-priority"' public/index.html
          grep -Fq 'class="ed-home-secondary"' public/index.html
          grep -Fq 'Answer Key &amp; Syllabus' public/index.html
          grep -Fq 'Scholarships &amp; Yojana' public/index.html
          grep -Fq 'Rajasthan Government Jobs' public/index.html
          grep -Fq 'All India Government Jobs' public/index.html
          # Fail closed if split sitemap files are missing or malformed.
          test -s public/sitemap_index.xml
          test -s public/post-sitemap.xml
          test -s public/page-sitemap.xml
          test -s public/category-sitemap.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('public/sitemap_index.xml').getroot()
          refs = [n.text.strip() for n in root.findall('sm:sitemap/sm:loc', ns) if n.text and n.text.strip()]
          required = {'post-sitemap.xml', 'page-sitemap.xml', 'category-sitemap.xml'}
          if len(refs) < 3 or not all(any(ref.endswith(name) for ref in refs) for name in required):
              raise SystemExit(f'Sitemap index missing expected child sitemaps: {refs}')
          for name in ('post-sitemap.xml', 'page-sitemap.xml', 'category-sitemap.xml'):
              ET.parse(Path('public') / name)
          print(f'Sitemap index references {len(refs)} child sitemap(s); XML parses successfully.')
          PY

      - name: Report SEO sanity checks
        run: |
          python scripts/seo_sanity_audit.py

      - name: Install Firebase CLI
        if: github.event_name != 'pull_request'
        run: |
          npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          firebase use examdarpan-dd963
          firebase deploy --only hosting --non-interactive

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f /tmp/firebase-service-account.json
