name: Exam Darpan Automatic SEO Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Static article views do not read Firestore. Rebuild hourly to reduce
    # background full-collection Firestore reads; GitHub may delay scheduled runs.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: examdarpan-static-seo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r monitor_requirements.txt

      - name: Build static SEO pages
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/generate_static.py

      - name: Verify generated homepage
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/categories.html
          grep -Fq 'id="exam-darpan-home-final-order"' public/index.html
          grep -Fq 'class="ed-home-live"' public/index.html
          grep -Fq 'class="ed-home-priority"' public/index.html
          grep -Fq 'class="ed-home-secondary"' public/index.html
          grep -Fq 'Answer Key &amp; Syllabus' public/index.html
          grep -Fq 'Scholarships &amp; Yojana' public/index.html
          grep -Fq 'Rajasthan Government Jobs' public/index.html
          grep -Fq 'All India Government Jobs' public/index.html

      - name: Report SEO sanity checks
        run: |
          python scripts/seo_sanity_audit.py

      - name: Install Firebase CLI
        if: github.event_name != 'pull_request'
        run: |
          npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          firebase use examdarpan-dd963
          firebase deploy --only hosting --non-interactive

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f /tmp/firebase-service-account.json
