name: SEO Non-Deploy Validation

on:
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "firebase.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        run: |
          python -m py_compile scripts/generate_static.py
          if [ -f scripts/seo_sanity_audit.py ]; then
            python -m py_compile scripts/seo_sanity_audit.py
          fi

      - name: Validate checked-in sitemap XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("public/sitemap.xml")
          root = ET.parse(path).getroot()
          namespace = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          assert root.tag == namespace + "urlset", f"Unexpected root element: {root.tag}"
          urls = [node.text.strip() for node in root.findall(namespace + "url/" + namespace + "loc") if node.text and node.text.strip()]
          assert urls, "Sitemap has no URL entries"
          assert len(urls) == len(set(urls)), "Sitemap contains duplicate URLs"
          bad = [url for url in urls if not url.startswith("https://examdarpan.in/")]
          assert not bad, f"Unexpected sitemap URL host/scheme: {bad[:5]}"
          print(f"Validated sitemap XML: {len(urls)} unique URLs on preferred HTTPS host")
          PY

      - name: Run report-only SEO audit
        run: python scripts/seo_sanity_audit.py

      - name: Ensure this workflow never deploys
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/seo-nondeploy-validation.yml").read_text()
          forbidden = ["firebase" + " deploy", "gcloud" + " deploy", "netlify" + " deploy"]
          assert not any(command in workflow for command in forbidden), "Deploy command found in validation workflow"
          print("Validation workflow contains no deploy command")
          PY
