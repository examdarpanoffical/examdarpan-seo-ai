<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Exam Darpan</title><link rel="stylesheet" href="../styles.css"><script src="../firebase-config.js"></script><link rel="icon" type="image/png" href="/assets/logo.png?v=20260924-3"><link rel="apple-touch-icon" href="/assets/logo.png?v=20260924-3"><meta property="og:image" content="https://examdarpan.in/assets/og-logo.png"><script>
/* Exam Darpan: remove legacy splash/service-worker/cache */
(function(){
  try {
    var KEY = "ed-legacy-cache-cleanup-v1";
    if (!sessionStorage.getItem(KEY)) {
      sessionStorage.setItem(KEY, "1");

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs) {
          return Promise.all(rs.map(function(r) { return r.unregister(); }));
        }).catch(function(){});
      }

      if ("caches" in window) {
        caches.keys().then(function(keys) {
          return Promise.all(keys.map(function(k) { return caches.delete(k); }));
        }).catch(function(){});
      }
    }
  } catch(e) {}
})();
</script>
</head>
<body class="admin-shell"><main class="container" style="max-width:520px;padding-top:60px"><div class="form">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
<img src="/assets/logo.png?v=20260924-3"
     width="58"
     height="58"
     alt="Exam Darpan logo"
     style="display:block;border-radius:50%;background:#fff;padding:3px;box-shadow:0 4px 14px rgba(15,23,42,.12)">
<h1 style="margin:0">Exam Darpan Admin</h1>
</div>
<p class="meta">Authorized editors only.</p>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="login" class="btn btn-primary" style="width:100%">Login</button><p id="msg" class="meta"></p></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import{initializeAppCheck,ReCaptchaEnterpriseProvider}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-app-check.js';
const app=initializeApp(window.FIREBASE_CONFIG);
if(window.FIREBASE_APPCHECK_SITE_KEY){try{initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(window.FIREBASE_APPCHECK_SITE_KEY),isTokenAutoRefreshEnabled:true});}catch(e){console.warn(e)}}
const auth=getAuth(app),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),loginBtn=document.getElementById('login'),msgEl=document.getElementById('msg');
loginBtn.addEventListener('click',async()=>{msgEl.textContent='Signing in…';loginBtn.disabled=true;try{await signInWithEmailAndPassword(auth,emailEl.value.trim(),passwordEl.value);location.href='dashboard.html'}catch(e){console.error(e);msgEl.textContent=e.code?e.code+': '+e.message:e.message;loginBtn.disabled=false}});
</script></body></html>
