  <meta charset="utf-8">
  <title>Calendar Date Debug</title>
<link rel="icon" type="image/png" href="/assets/logo.png?v=20260924"><link rel="apple-touch-icon" href="/assets/logo.png?v=20260924"><meta property="og:image" content="https://examdarpan.in/assets/og-logo.png"></head>
<body>
<pre id="out">Loading…</pre>

<script src="/firebase-config.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, where, limit
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const out = document.getElementById("out");

try {
  const app = initializeApp(window.FIREBASE_CONFIG, "calendarDateDebug");
  const db = getFirestore(app);

  const snap = await getDocs(
    query(
      collection(db, "posts"),
      where("status", "==", "published"),
      limit(500)
    )
  );

  const rows = snap.docs.map(d => {
    const p = d.data();

    return {
      id: d.id,
      title: p.title || "",
      category: p.category || "",
      applicationStartDate: p.applicationStartDate || "",
      applicationLastDate: p.applicationLastDate || "",
      lastDate: p.lastDate || "",
      examDate: p.examDate || "",
      startDate: p.startDate || "",
      applyStartDate: p.applyStartDate || "",
      applyLastDate: p.applyLastDate || "",
      content: String(
        p.content ||
        p.articleContent ||
        p.description ||
        p.body ||
        p.excerpt ||
        ""
      ).slice(0, 3000)
    };
  });

  out.textContent =
    "TOTAL PUBLISHED = " + rows.length +
    "\\n\\n" +
    rows.map((x, i) =>
      "========== " + (i + 1) + " ==========" +
      "\\nTITLE: " + x.title +
      "\\nCATEGORY: " + x.category +
      "\\napplicationStartDate: " + x.applicationStartDate +
      "\\napplicationLastDate: " + x.applicationLastDate +
      "\\nlastDate: " + x.lastDate +
      "\\nexamDate: " + x.examDate +
      "\\nstartDate: " + x.startDate +
      "\\napplyStartDate: " + x.applyStartDate +
      "\\napplyLastDate: " + x.applyLastDate +
      "\\nCONTENT:\\n" + x.content +
      "\\n"
    ).join("\\n");

} catch (e) {
  console.error(e);
  out.textContent = "ERROR:\\n" + (e.stack || e);
}
</script>
