import{initializeApp}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';import{getFirestore,collection,getDocs,query,where,limit}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
const app=initializeApp(window.FIREBASE_CONFIG),db=getFirestore(app),root=document.getElementById('articleRoot');
const pathParts=location.pathname.replace(/^\/+|\/+$/g,'').split('/').filter(Boolean);const raw=pathParts[0]==='article'?pathParts[1]:pathParts[0];let slug=raw?decodeURIComponent(raw):new URLSearchParams(location.search).get('slug');
const esc=s=>(s??'').toString().replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=v=>{try{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':new Intl.DateTimeFormat('hi-IN',{day:'2-digit',month:'long',year:'numeric'}).format(d)}catch{return'—'}};const absolute=s=>'https://examdarpan.in/'+encodeURIComponent(String(s||'').trim());
function meta(name,content){const el=document.querySelector(`meta[name="${name}"]`);if(el)el.content=content||''}function prop(name,content){const el=document.querySelector(`meta[property="${name}"]`);if(el)el.content=content||''}
async function load(){if(!slug){root.innerHTML='<div class="empty"><h2>Article URL incomplete</h2><p>इस article का URL सही नहीं है।</p><a class="btn btn-dark" href="/">Home पर जाएं</a></div>';return}slug=slug.trim();try{const q=query(collection(db,'posts'),where('slug','==',slug),where('status','==','published'),limit(1));const snap=await getDocs(q);const match=snap.docs[0];if(!match){root.innerHTML='<div class="empty"><h2>Article नहीं मिला</h2><p>यह article उपलब्ध नहीं है या अभी publish नहीं किया गया है।</p><a class="btn btn-dark" href="/">Home पर जाएं</a></div>';return}
const p=match.data(),url=absolute(p.slug),oldPath=location.pathname,title=p.title||'Exam Darpan Article',desc=(p.excerpt||'').trim()||'Exam Darpan पर परीक्षा, भर्ती, रिजल्ट और सरकारी नौकरी की जानकारी पढ़ें।';if(oldPath.startsWith('/article/')){history.replaceState({},'', '/'+encodeURIComponent(String(p.slug||'').trim()));}document.title=title+' | Exam Darpan';document.querySelector('link[rel="canonical"]').href=url;meta('description',desc);prop('og:title',title+' | Exam Darpan');prop('og:description',desc);prop('og:url',url);if(p.featuredImage)prop('og:image',p.featuredImage);
const published=p.publishedAt?.toDate?.()?.toISOString?.()||null,modified=p.updatedAt?.toDate?.()?.toISOString?.()||published;const schema={"@context":"https://schema.org","@type":"Article","headline":title,"description":desc,"url":url,"mainEntityOfPage":{"@type":"WebPage","@id":url},"author":{"@type":"Organization","name":"Exam Darpan Editorial Team","url":"https://examdarpan.in/editorial-policy.html"},"publisher":{"@type":"Organization","name":"Exam Darpan","url":"https://examdarpan.in/","logo":{"@type":"ImageObject","url":"https://examdarpan.in/assets/logo.webp"}},"datePublished":published,"dateModified":modified,"articleSection":p.category||'Latest Updates'};if(p.featuredImage)schema.image=[p.featuredImage];const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(schema);document.head.appendChild(sc);
const articleText=String(p.content||'').replace(/<[^>]*>/g,' ').trim();const mins=Math.max(1,Math.ceil(articleText.split(/\s+/).filter(Boolean).length/180));
root.innerHTML=`<nav class="meta" aria-label="Breadcrumb"><a href="/">Home</a> / ${esc(p.category||'Article')}</nav><div style="margin-top:12px"><span class="badge">${esc(p.category||'Latest Update')}</span></div><h1>${esc(title)}</h1><div class="meta">प्रकाशित: ${fmt(p.publishedAt)} · अपडेट: ${fmt(p.updatedAt||p.publishedAt)} · ${mins} min read</div><div class="article-cover article-cover-card" role="img" aria-label="${esc(title)}"><div class="article-cover-glow"></div><div class="article-cover-inner"><span class="article-cover-kicker">${esc(p.category||'Latest Update')}</span><h2>${esc(title)}</h2><div class="article-cover-brand"><strong>EXAM DARPAN</strong><span>Vacancy Se Result Tak, Har Jankari Ek Jagah</span></div></div></div><div class="article-content" style="margin-top:20px">${p.content||'<p>Content उपलब्ध नहीं है।</p>'}</div><div class="notice">महत्वपूर्ण: आवेदन, परीक्षा या परिणाम से जुड़ी कार्रवाई से पहले संबंधित विभाग की official notification जरूर verify करें।</div><div class="article-actions">${p.applyOnlineUrl?`<a class="btn btn-primary" href="${esc(p.applyOnlineUrl)}" target="_blank" rel="nofollow noopener">Apply Online ↗</a>`:''}${p.officialNotificationUrl?`<a class="btn btn-dark" href="${esc(p.officialNotificationUrl)}" target="_blank" rel="nofollow noopener">Official Notification ↗</a>`:''}${p.officialWebsiteUrl?`<a class="btn btn-gold" href="${esc(p.officialWebsiteUrl)}" target="_blank" rel="nofollow noopener">Official Website ↗</a>`:''}${p.notificationPdfUrl?`<a class="btn btn-dark" href="${esc(p.notificationPdfUrl)}" target="_blank" rel="nofollow noopener">Notification PDF ↗</a>`:''}</div><section class="community-card"><div><span class="section-label">EXAM DARPAN COMMUNITY</span><h2>नई भर्ती और परीक्षा updates से जुड़े रहें</h2><p>Important vacancy, admit card, result और exam updates के लिए community से जुड़े रहें।</p></div><div class="community-actions"><p>ऐसी नई updates के लिए Exam Darpan के Telegram और WhatsApp channels से जुड़ें.</p><div class="links"><a class="btn btn-primary" href="https://t.me/examdarpanofficial" target="_blank" rel="noopener">Telegram</a><a class="btn btn-gold" href="https://whatsapp.com/channel/0029VbCwH1n2kNFl5EWNGu3c" target="_blank" rel="noopener">WhatsApp</a></div></div>`;
}catch(e){console.error(e);root.innerHTML='<div class="empty"><h2>Article load नहीं हो पाया</h2><p>Network या Firestore connection में समस्या हुई। कुछ सेकंड बाद refresh करके फिर कोशिश करें.</p><a class="btn btn-dark" href="/">Home पर जाएं</a></div>'}}
